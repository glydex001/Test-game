name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          KIDCARS_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; then
            # surface the error text as an annotation (visible from the API)
            msg=$(grep -n -i -E "error|wrong|exception|FAILED|Caused by" build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle failed::${msg}"
            tail -n 60 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::error title=Gradle tail::{}"
            exit 1
          fi

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/KidCars-v1.${{ github.run_number }}.apk"
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidCars-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Kid Cars v1.${{ github.run_number }}
          body: |
            Install on Android: download the .apk below, open it on the phone, allow "install unknown apps" if asked.
            Updates install over the previous version — no need to uninstall first.
          files: out/*.apk
