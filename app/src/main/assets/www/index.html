<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kid Cars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD while driving -->
<div id="hud" class="hidden">
  <div id="speedo">
    <div id="speedval">0</div>
    <div class="unit">km/h</div>
  </div>
  <div id="dist">0.0 km</div>
  <button id="btnPause" class="iconbtn" aria-label="Pause">❚❚</button>
  <button id="btnCam" class="iconbtn cam" aria-label="Camera">📷</button>

  <div id="leftpad">
    <button class="ctl steer" id="btnLeft" aria-label="Left">◀</button>
    <button class="ctl steer" id="btnRight" aria-label="Right">▶</button>
  </div>
  <div id="wheel" aria-label="Steering wheel">
    <div id="wheelimg">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <defs><radialGradient id="rim" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#3a3f47"/><stop offset="1" stop-color="#15181d"/></radialGradient>
        <radialGradient id="hub" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#5b6572"/><stop offset="1" stop-color="#1c2129"/></radialGradient></defs>
        <circle cx="100" cy="100" r="92" fill="url(#rim)" stroke="#0c0e12" stroke-width="4"/>
        <circle cx="100" cy="100" r="66" fill="none" stroke="#0c0e12" stroke-width="3"/>
        <circle cx="100" cy="100" r="66" fill="rgba(0,0,0,0.0)"/>
        <path d="M100 100 L34 100 M100 100 L166 100 M100 100 L100 166" stroke="#23282f" stroke-width="22" stroke-linecap="round"/>
        <path d="M100 100 L34 100 M100 100 L166 100 M100 100 L100 166" stroke="#3a4149" stroke-width="12" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="30" fill="url(#hub)" stroke="#0c0e12" stroke-width="3"/>
        <circle cx="100" cy="100" r="13" fill="#D0B46C"/>
        <rect x="94" y="12" width="12" height="18" rx="4" fill="#D0B46C"/>
      </svg>
    </div>
  </div>
  <div id="rightpad">
    <button class="ctl brake" id="btnBrake" aria-label="Brake"><span class="pedal-label">STOP</span></button>
    <button class="ctl gas" id="btnGas" aria-label="Gas"><span class="pedal-label">GO</span></button>
  </div>
  <div id="extras">
    <button class="ctl small" id="btnHorn" aria-label="Horn">📣</button>
    <button class="ctl small boost" id="btnBoost" aria-label="Boost">⚡</button>
  </div>
  <div id="boostbar"><div id="boostfill"></div></div>
  <div id="mapbox" class="hidden"><canvas id="minimap" width="150" height="150"></canvas><div id="street"></div></div>
  <div id="dmgbar" title="Car health"><span>🔧</span><div id="dmgtrack"><div id="dmgfill"></div></div></div>
  <div id="totaled" class="hidden">
    <div class="totaltxt">Oops! Car is broken</div>
    <button id="btnFix">🔧 FIX MY CAR</button>
  </div>
</div>

<!-- Garage / main menu -->
<div id="menu">
  <div id="title">KID CARS</div>
  <div id="brandline"><img src="tex/logo.webp" alt="Glyde-X"><span>presents</span></div>
  <div id="carname">Sports Car</div>
  <button id="prevCar" class="arrow" aria-label="Previous car">‹</button>
  <button id="nextCar" class="arrow" aria-label="Next car">›</button>

  <div id="options">
    <div class="optrow" id="worldRow">
      <button class="opt" data-world="country">🌳</button>
      <button class="opt" data-world="desert">🌵</button>
      <button class="opt" data-world="city">🏙️</button>
      <button class="opt" data-world="snow">⛄</button>
      <button class="opt" data-world="lenasia">🏘️</button>
    </div>
    <div class="optrow" id="timeRow">
      <button class="opt" data-time="day">☀️</button>
      <button class="opt" data-time="sunset">🌇</button>
      <button class="opt" data-time="night">🌙</button>
    </div>
    <div class="optrow" id="miscRow">
      <button class="opt" id="optTraffic">🚗🚙</button>
      <button class="opt" id="optSound">🔊</button>
      <button class="opt" id="optTilt">📱</button>
      <button class="opt" id="optCtl">🎡</button>
    </div>
  </div>

  <div id="colors"></div>
  <button id="btnPlay">DRIVE</button>
</div>

<div id="loading">
  <div class="loadcard">
    <img src="tex/logo.webp" alt="Glyde-X Recliners">
    <div class="loadtitle">KID CARS</div>
    <div id="loadbar"><div id="loadfill"></div></div>
    <div id="loadtxt">Starting engines…</div>
  </div>
</div>
<div id="rotate"><div>Turn your phone sideways 🔄</div></div>

<script src="game.js"></script>
</body>
</html>
