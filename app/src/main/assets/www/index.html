<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kid Cars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD while driving -->
<div id="hud" class="hidden">
  <div id="speedo">
    <div id="speedval">0</div>
    <div class="unit">km/h</div>
  </div>
  <div id="dist">0.0 km</div>
  <button id="btnPause" class="iconbtn" aria-label="Pause">❚❚</button>
  <button id="btnCam" class="iconbtn cam" aria-label="Camera">📷</button>

  <div id="leftpad">
    <button class="ctl steer" id="btnLeft" aria-label="Left">◀</button>
    <button class="ctl steer" id="btnRight" aria-label="Right">▶</button>
  </div>
  <div id="rightpad">
    <button class="ctl brake" id="btnBrake" aria-label="Brake">STOP</button>
    <button class="ctl gas" id="btnGas" aria-label="Gas">GO</button>
  </div>
  <div id="extras">
    <button class="ctl small" id="btnHorn" aria-label="Horn">📣</button>
    <button class="ctl small boost" id="btnBoost" aria-label="Boost">⚡</button>
  </div>
  <div id="boostbar"><div id="boostfill"></div></div>
  <div id="dmgbar" title="Car health"><span>🔧</span><div id="dmgtrack"><div id="dmgfill"></div></div></div>
  <div id="totaled" class="hidden">
    <div class="totaltxt">Oops! Car is broken</div>
    <button id="btnFix">🔧 FIX MY CAR</button>
  </div>
</div>

<!-- Garage / main menu -->
<div id="menu">
  <div id="title">KID CARS</div>
  <div id="brandline"><img src="tex/logo.webp" alt="Glyde-X"><span>presents</span></div>
  <div id="carname">Sports Car</div>
  <button id="prevCar" class="arrow" aria-label="Previous car">‹</button>
  <button id="nextCar" class="arrow" aria-label="Next car">›</button>

  <div id="options">
    <div class="optrow" id="worldRow">
      <button class="opt" data-world="country">🌳</button>
      <button class="opt" data-world="desert">🌵</button>
      <button class="opt" data-world="city">🏙️</button>
      <button class="opt" data-world="snow">⛄</button>
    </div>
    <div class="optrow" id="timeRow">
      <button class="opt" data-time="day">☀️</button>
      <button class="opt" data-time="sunset">🌇</button>
      <button class="opt" data-time="night">🌙</button>
    </div>
    <div class="optrow" id="miscRow">
      <button class="opt" id="optTraffic">🚗🚙</button>
      <button class="opt" id="optSound">🔊</button>
      <button class="opt" id="optTilt">📱</button>
    </div>
  </div>

  <div id="colors"></div>
  <button id="btnPlay">DRIVE</button>
</div>

<div id="loading">
  <div class="loadcard">
    <img src="tex/logo.webp" alt="Glyde-X Recliners">
    <div class="loadtitle">KID CARS</div>
    <div id="loadbar"><div id="loadfill"></div></div>
    <div id="loadtxt">Starting engines…</div>
  </div>
</div>
<div id="rotate"><div>Turn your phone sideways 🔄</div></div>

<script src="game.js"></script>
</body>
</html>
